<!DOCTYPE html>

<head> 
    <meta charset="UTF-8">
    <title>PM Tool</title>

</head>

<body>
<div id="app">

    <div id="sidebar">

        <h3>Strategic</h3>
        <div class="sidebar-item" onclick="openStrategic()">Strategic Objectives</div>

        <h3>Programs</h3>
        <div class="sidebar-item" onclick="openProgramDashboard()">Program Dashboard</div>

    </div>

    <div id="main-view"></div>
